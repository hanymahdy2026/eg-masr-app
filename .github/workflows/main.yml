name: Build EG Masr APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --platforms=android .
      - run: |
          cat << 'EOF' > lib/main.dart
          import 'dart:io';
          import 'dart:math';
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'package:supabase_flutter/supabase_flutter.dart';
          import 'package:flutter_contacts/flutter_contacts.dart';
          import 'package:qr_flutter/qr_flutter.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:url_launcher/url_launcher.dart';
          import 'package:record/record.dart';
          import 'package:audioplayers/audioplayers.dart';
          import 'package:path_provider/path_provider.dart';

          typedef JsonMap = Map<String, dynamic>;
          const String ADMIN_CONTACT = 'h27n4y200@gmail.com';

          const List> SUPPORTED_LANGUAGES = [
            {'code': 'ar', 'name': 'العربية (Arabic)'},
            {'code': 'en', 'name': 'English'},
            {'code': 'fr', 'name': 'Français'},
            {'code': 'de', 'name': 'Deutsch'},
            {'code': 'es', 'name': 'Español'},
            {'code': 'it', 'name': 'Italiano'},
            {'code': 'tr', 'name': 'Türkçe'},
            {'code': 'ru', 'name': 'Русский'},
            {'code': 'zh', 'name': '中文'},
            {'code': 'ja', 'name': '日本語'},
            {'code': 'ko', 'name': '한국어'},
            {'code': 'hi', 'name': 'हिन्दी'},
            {'code': 'ur', 'name': 'اردو'},
            {'code': 'pt', 'name': 'Português'},
            {'code': 'nl', 'name': 'Nederlands'},
            {'code': 'sv', 'name': 'Svenska'},
            {'code': 'pl', 'name': 'Polski'},
            {'code': 'el', 'name': 'Ελληνικά'},
            {'code': 'id', 'name': 'Bahasa Indonesia'},
            {'code': 'ms', 'name': 'Bahasa Melayu'},
          ];

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await Supabase.initialize(
              url: 'https://bdbdimphbrsezftindck.supabase.co',
              anonKey: 'sb_publishable_pJ66bE2_25v6M4kG_uI1nA_g5cE6W0m',
            );
            runApp(const EgMasrSuperApp());
          }

          final supabase = Supabase.instance.client;

          class EgMasrSuperApp extends StatefulWidget {
            const EgMasrSuperApp({super.key});
            @override
            State<EgMasrSuperApp> createState() => _EgMasrSuperAppState();
          }

          class _EgMasrSuperAppState extends State<EgMasrSuperApp> {
            Locale _locale = const Locale('ar');
            void _changeLanguage(String code) => setState(() => _locale = Locale(code));

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'EG Masr',
                locale: _locale,
                supportedLocales: SUPPORTED_LANGUAGES.map((l) => Locale(l['code']!)).toList(),
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF075E54)),
                  useMaterial3: true,
                ),
                home: DualAuthScreen(
                  currentLang: _locale.languageCode,
                  onLangChanged: _changeLanguage,
                ),
              );
            }
          }

          class DualAuthScreen extends StatefulWidget {
            final String currentLang;
            final Function(String) onLangChanged;
            const DualAuthScreen({super.key, required this.currentLang, required this.onLangChanged});
            @override
            State<DualAuthScreen> createState() => _DualAuthScreenState();
          }

          class _DualAuthScreenState extends State<DualAuthScreen> with SingleTickerProviderStateMixin {
            late TabController _tabController;
            final _personalContactCtrl = TextEditingController();
            final _personalNameCtrl = TextEditingController();
            final _otpCtrl = TextEditingController();
            bool _otpSent = false;
            bool _isLoading = false;

            final _compNameCtrl = TextEditingController();
            final _compAddressCtrl = TextEditingController();
            final _compPlotCtrl = TextEditingController();
            final _compTaxCtrl = TextEditingController();
            final _compManagerCtrl = TextEditingController();
            final _compContactCtrl = TextEditingController();

            @override
            void initState() {
              super.initState();
              _tabController = TabController(length: 2, vsync: this);
            }

            void _msg(String text) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(text)));
            }

            Future<void> _sendOtp() async {
              final contact = _personalContactCtrl.text.trim();
              if (contact.isEmpty) return;
              setState(() => _isLoading = true);
              final code = (100000 + Random().nextInt(900000)).toString();
              if (contact.contains('@')) {
                try {
                  await supabase.auth.signInWithOtp(email: contact);
                } catch (_) {}
              }
              setState(() {
                _otpSent = true;
                _isLoading = false;
              });
              _msg('كود التفعيل الخاص بك هو: $code');
            }

            Future<void> _verifyAndEnterPersonal() async {
              final contact = _personalContactCtrl.text.trim();
              final name = _personalNameCtrl.text.trim().isEmpty ? contact : _personalNameCtrl.text.trim();
              if (_otpCtrl.text.trim().length != 6) {
                _msg('أدخل كود من 6 أرقام');
                return;
              }
              setState(() => _isLoading = true);
              try {
                final existing = await supabase.from('users_profiles').select().eq('contact_info', contact).maybeSingle();
                JsonMap userData;
                if (existing == null) {
                  final qrData = 'EGMASR-${DateTime.now().millisecondsSinceEpoch}-${Random().nextInt(9999)}';
                  final isAdmin = (contact.toLowerCase() == ADMIN_CONTACT.toLowerCase());
                  userData = await supabase.from('users_profiles').insert({
                    'contact_info': contact,
                    'full_name': name,
                    'qr_code_data': qrData,
                    'is_admin': isAdmin,
                  }).select().single();
                } else {
                  userData = existing;
                }
                if (mounted) {
                  Navigator.pushReplacement(
                    context,
                    MaterialPageRoute(
                      builder: (_) => MainHomeScreen(
                        currentUser: userData,
                        isCompany: false,
                        currentLang: widget.currentLang,
                        onLangChanged: widget.onLangChanged,
                      ),
                    ),
                  );
                }
              } catch (e) {
                _msg('خطأ: $e');
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            Future<void> _submitCompany() async {
              final contact = _compContactCtrl.text.trim();
              if (contact.isEmpty) return;
              setState(() => _isLoading = true);
              try {
                final existing = await supabase.from('companies').select().eq('contact_info', contact).maybeSingle();
                if (existing != null) {
                  if (existing['status'] == 'approved') {
                    if (mounted) {
                      Navigator.pushReplacement(
                        context,
                        MaterialPageRoute(
                          builder: (_) => MainHomeScreen(
                            currentUser: existing,
                            isCompany: true,
                            currentLang: widget.currentLang,
                            onLangChanged: widget.onLangChanged,
                          ),
                        ),
                      );
                    }
                    return;
                  } else {
                    _msg('حساب شركتك قيد المراجعة والتأكيد من الأدمن حالياً');
                    return;
                  }
                }
                if (_compNameCtrl.text.isEmpty || _compAddressCtrl.text.isEmpty || _compPlotCtrl.text.isEmpty || _compTaxCtrl.text.isEmpty || _compManagerCtrl.text.isEmpty) {
                  _msg('يرجى ملء جميع بيانات المنشأة');
                  return;
                }
                await supabase.from('companies').insert({
                  'company_name': _compNameCtrl.text.trim(),
                  'address': _compAddressCtrl.text.trim(),
                  'plot_number': _compPlotCtrl.text.trim(),
                  'tax_reg_number': _compTaxCtrl.text.trim(),
                  'manager_name': _compManagerCtrl.text.trim(),
                  'contact_info': contact,
                  'status': 'pending',
                });
                _msg('تم إرسال طلب الشركة بنجاح! في انتظار تأكيد الأدمن.');
              } catch (e) {
                _msg('خطأ: $e');
              } finally {
                if (mounted) setState(() => _isLoading = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('EG Masr', style: TextStyle(fontWeight: FontWeight.bold, color: Colors.white)),
                  backgroundColor: const Color(0xFF075E54),
                  actions: [
                    DropdownButton<String>(
                      value: widget.currentLang,
                      dropdownColor: const Color(0xFF075E54),
                      icon: const Icon(Icons.language, color: Colors.white),
                      underline: const SizedBox(),
                      style: const TextStyle(color: Colors.white, fontSize: 13),
                      items: SUPPORTED_LANGUAGES.map((l) => DropdownMenuItem(value: l['code'], child: Text(l['name']!))).toList(),
                      onChanged: (v) {
                        if (v != null) widget.onLangChanged(v);
                      },
                    ),
                  ],
                  bottom: TabBar(
                    controller: _tabController,
                    labelColor: Colors.white,
                    unselectedLabelColor: Colors.white70,
                    indicatorColor: Colors.amber,
                    tabs: const [
                      Tab(icon: Icon(Icons.person), text: 'حساب شخصي'),
                      Tab(icon: Icon(Icons.business), text: 'حساب شركات'),
                    ],
                  ),
                ),
                body: TabBarView(
                  controller: _tabController,
                  children: [
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(20),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const Icon(Icons.verified_user, size: 65, color: Color(0xFF075E54)),
                          const SizedBox(height: 16),
                          TextField(controller: _personalNameCtrl, decoration: const InputDecoration(labelText: 'الاسم الكامل', border: OutlineInputBorder())),
                          const SizedBox(height: 12),
                          TextField(controller: _personalContactCtrl, decoration: const InputDecoration(labelText: 'الإيميل (Gmail) أو رقم الهاتف', border: OutlineInputBorder())),
                          const SizedBox(height: 16),
                          if (!_otpSent)
                            ElevatedButton(
                              onPressed: _isLoading ? null : _sendOtp,
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF075E54), foregroundColor: Colors.white, padding: const EdgeInsets.all(14)),
                              child: const Text('إرسال كود التحقق (6 أرقام)'),
                            )
                          else ...[
                            TextField(controller: _otpCtrl, keyboardType: TextInputType.number, maxLength: 6, textAlign: TextAlign.center, decoration: const InputDecoration(labelText: 'كود التحقق (6 أرقام)', border: OutlineInputBorder())),
                            const SizedBox(height: 12),
                            ElevatedButton(
                              onPressed: _isLoading ? null : _verifyAndEnterPersonal,
                              style: ElevatedButton.styleFrom(backgroundColor: Colors.green, foregroundColor: Colors.white, padding: const EdgeInsets.all(14)),
                              child: const Text('تأكيد ودخول'),
                            ),
                          ],
                        ],
                      ),
                    ),
                    SingleChildScrollView(
                      padding: const EdgeInsets.all(20),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          TextField(controller: _compContactCtrl, decoration: const InputDecoration(labelText: 'بريد أو هاتف الشركة *', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: _compNameCtrl, decoration: const InputDecoration(labelText: 'اسم المنشأة / الشركة', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: _compAddressCtrl, decoration: const InputDecoration(labelText: 'العنوان', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: _compPlotCtrl, decoration: const InputDecoration(labelText: 'رقم القطعة', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: _compTaxCtrl, decoration: const InputDecoration(labelText: 'رقم التسجيل الضريبي', border: OutlineInputBorder())),
                          const SizedBox(height: 10),
                          TextField(controller: _compManagerCtrl, decoration: const InputDecoration(labelText: 'اسم المسؤول', border: OutlineInputBorder())),
                          const SizedBox(height: 16),
                          ElevatedButton(
                            onPressed: _isLoading ? null : _submitCompany,
                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF075E54), foregroundColor: Colors.white, padding: const EdgeInsets.all(14)),
                            child: const Text('تسجيل / دخول الشركات'),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            final JsonMap currentUser;
            final bool isCompany;
            final String currentLang;
            final Function(String) onLangChanged;
            const MainHomeScreen({super.key, required this.currentUser, required this.isCompany, required this.currentLang, required this.onLangChanged});
            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _idx = 0;
            List<Contact> _contacts = [];
            List<JsonMap> _users = [];
            String _search = '';

            @override
            void initState() {
              super.initState();
              _loadData();
            }

            Future<void> _loadData() async {
              try {
                final res = await supabase.from('users_profiles').select();
                _users = List<JsonMap>.from(res);
                if (await FlutterContacts.requestPermission(readonly: true)) {
                  _contacts = await FlutterContacts.getContacts(withProperties: true);
                }
                if (mounted) setState(() {});
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              final bool isAdmin = (!widget.isCompany && widget.currentUser['is_admin'] == true);
              final String name = widget.isCompany ? widget.currentUser['company_name'] : (widget.currentUser['full_name'] ?? '');
              final myContact = widget.currentUser['contact_info'];

              final pages = [
                Column(
                  children: [
                    ListTile(
                      leading: const CircleAvatar(backgroundColor: Color(0xFF075E54), child: Icon(Icons.groups, color: Colors.white)),
                      title: const Text('المحادثة العامة (EG Masr)', style: TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text('صور، فيديو، صوت، موقع جغرافي، وروابط'),
                      onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => MultimediaChatScreen(senderName: name, senderContact: myContact, receiverContact: 'ALL', chatTitle: 'المحادثة العامة'))),
                    ),
                    const Divider(),
                    Expanded(
                      child: ListView.builder(
                        itemCount: _users.length,
                        itemBuilder: (_, i) {
                          final u = _users[i];
                          if (u['contact_info'] == myContact) return const SizedBox.shrink();
                          return ListTile(
                            leading: const CircleAvatar(child: Icon(Icons.person)),
                            title: Text(u['full_name'] ?? ''),
                            subtitle: Text(u['contact_info'] ?? ''),
                            onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => MultimediaChatScreen(senderName: name, senderContact: myContact, receiverContact: u['contact_info'], chatTitle: u['full_name'] ?? ''))),
                          );
                        },
                      ),
                    ),
                  ],
                ),
                Column(
                  children: [
                    Padding(
                      padding: const EdgeInsets.all(10),
                      child: TextField(
                        decoration: const InputDecoration(hintText: 'بحث بالاسم أو الرقم...', prefixIcon: Icon(Icons.search), border: OutlineInputBorder()),
                        onChanged: (v) => setState(() => _search = v),
                      ),
                    ),
                    Expanded(
                      child: ListView(
                        children: [
                          ..._users.where((u) => (u['full_name'] ?? '').toString().toLowerCase().contains(_search.toLowerCase()) || (u['contact_info'] ?? '').toString().contains(_search)).map((u) => ListTile(
                                leading: const CircleAvatar(backgroundColor: Colors.teal, child: Icon(Icons.verified, color: Colors.white)),
                                title: Text(u['full_name'] ?? ''),
                                subtitle: Text(u['contact_info'] ?? ''),
                                onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => MultimediaChatScreen(senderName: name, senderContact: myContact, receiverContact: u['contact_info'], chatTitle: u['full_name'] ?? ''))),
                              )),
                          ..._contacts.where((c) => c.displayName.toLowerCase().contains(_search.toLowerCase()) || c.phones.any((p) => p.number.contains(_search))).map((c) {
                            final ph = c.phones.isNotEmpty ? c.phones.first.number : '';
                            return ListTile(
                              leading: const CircleAvatar(child: Icon(Icons.contact_phone)),
                              title: Text(c.displayName),
                              subtitle: Text(ph),
                              onTap: () => Navigator.push(context, MaterialPageRoute(builder: (_) => MultimediaChatScreen(senderName: name, senderContact: myContact, receiverContact: ph, chatTitle: c.displayName))),
                            );
                          }),
                        ],
                      ),
                    ),
                  ],
                ),
                Center(
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Text(name, style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 16),
                      QrImageView(data: widget.currentUser['qr_code_data'] ?? myContact, size: 220),
                      const SizedBox(height: 12),
                      const Text('الباركود الخاص بحسابك'),
                    ],
                  ),
                ),
                if (isAdmin) const AdminPanelTab(),
              ];

              return Scaffold(
                appBar: AppBar(
                  title: Text('EG Masr - $name', style: const TextStyle(color: Colors.white, fontSize: 16)),
                  backgroundColor: const Color(0xFF075E54),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.logout, color: Colors.white),
                      onPressed: () => Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => DualAuthScreen(currentLang: widget.currentLang, onLangChanged: widget.onLangChanged))),
                    ),
                  ],
                ),
                body: pages[_idx],
                bottomNavigationBar: BottomNavigationBar(
                  currentIndex: _idx,
                  selectedItemColor: const Color(0xFF075E54),
                  type: BottomNavigationBarType.fixed,
                  onTap: (i) => setState(() => _idx = i),
                  items: [
                    const BottomNavigationBarItem(icon: Icon(Icons.chat), label: 'المحادثات'),
                    const BottomNavigationBarItem(icon: Icon(Icons.search), label: 'الأرقام والبحث'),
                    const BottomNavigationBarItem(icon: Icon(Icons.qr_code), label: 'الباركود'),
                    if (isAdmin) const BottomNavigationBarItem(icon: Icon(Icons.admin_panel_settings), label: 'الأدمن'),
                  ],
                ),
              );
            }
          }

          class AdminPanelTab extends StatefulWidget {
            const AdminPanelTab({super.key});
            @override
            State<AdminPanelTab> createState() => _AdminPanelTabState();
          }

          class _AdminPanelTabState extends State<AdminPanelTab> {
            @override
            Widget build(BuildContext context) {
              return FutureBuilder(
                future: supabase.from('companies').select().order('created_at', ascending: false),
                builder: (_, snap) {
                  if (!snap.hasData) return const Center(child: CircularProgressIndicator());
                  final list = List<JsonMap>.from(snap.data as List);
                  return ListView.builder(
                    itemCount: list.length,
                    itemBuilder: (_, i) {
                      final c = list[i];
                      return Card(
                        margin: const EdgeInsets.all(8),
                        child: ListTile(
                          title: Text('${c['company_name']} (${c['status']})'),
                          subtitle: Text('المسؤول: ${c['manager_name']} | ضريبي: ${c['tax_reg_number']} | قطعة: ${c['plot_number']}'),
                          trailing: Row(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              IconButton(
                                icon: const Icon(Icons.check_circle, color: Colors.green),
                                onPressed: () async {
                                  await supabase.from('companies').update({'status': 'approved'}).eq('id', c['id']);
                                  setState(() {});
                                },
                              ),
                              IconButton(
                                icon: const Icon(Icons.cancel, color: Colors.red),
                                onPressed: () async {
                                  await supabase.from('companies').update({'status': 'rejected'}).eq('id', c['id']);
                                  setState(() {});
                                },
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }
          }

          class MultimediaChatScreen extends StatefulWidget {
            final String senderName;
            final String senderContact;
            final String receiverContact;
            final String chatTitle;
            const MultimediaChatScreen({super.key, required this.senderName, required this.senderContact, required this.receiverContact, required this.chatTitle});
            @override
            State<MultimediaChatScreen> createState() => _MultimediaChatScreenState();
          }

          class _MultimediaChatScreenState extends State<MultimediaChatScreen> {
            final _ctrl = TextEditingController();
            final _picker = ImagePicker();
            final _rec = AudioRecorder();
            final _player = AudioPlayer();
            bool _recording = false;

            Future<void> _sendText() async {
              final t = _ctrl.text.trim();
              if (t.isEmpty) return;
              _ctrl.clear();
              final isLink = t.startsWith('http');
              await supabase.from('messages').insert({
                'sender_phone': widget.senderContact,
                'receiver_contact': widget.receiverContact,
                'content': '${widget.senderName}: $t',
                'msg_type': isLink ? 'link' : 'text',
                'media_url': isLink ? t : null,
              });
            }

            Future<void> _sendMedia(bool video) async {
              final f = video ? await _picker.pickVideo(source: ImageSource.gallery) : await _picker.pickImage(source: ImageSource.gallery, imageQuality: 70);
              if (f == null) return;
              final bytes = await f.readAsBytes();
              final name = '${DateTime.now().millisecondsSinceEpoch}_${f.name}';
              await supabase.storage.from('chat_media').uploadBinary(name, bytes);
              final url = supabase.storage.from('chat_media').getPublicUrl(name);
              await supabase.from('messages').insert({
                'sender_phone': widget.senderContact,
                'receiver_contact': widget.receiverContact,
                'content': video ? '${widget.senderName}: فيديو 🎥' : '${widget.senderName}: صورة 📷',
                'msg_type': video ? 'video' : 'image',
                'media_url': url,
              });
            }

            Future<void> _toggleAudio() async {
              if (_recording) {
                final path = await _rec.stop();
                setState(() => _recording = false);
                if (path != null) {
                  final bytes = await File(path).readAsBytes();
                  final name = 'aud_${DateTime.now().millisecondsSinceEpoch}.m4a';
                  await supabase.storage.from('chat_media').uploadBinary(name, bytes);
                  final url = supabase.storage.from('chat_media').getPublicUrl(name);
                  await supabase.from('messages').insert({
                    'sender_phone': widget.senderContact,
                    'receiver_contact': widget.receiverContact,
                    'content': '${widget.senderName}: رسالة صوتية 🎤',
                    'msg_type': 'audio',
                    'media_url': url,
                  });
                }
              } else if (await _rec.hasPermission()) {
                final dir = await getTemporaryDirectory();
                await _rec.start(const RecordConfig(), path: '${dir.path}/r_${DateTime.now().millisecondsSinceEpoch}.m4a');
                setState(() => _recording = true);
              }
            }

            Future<void> _sendLoc() async {
              var p = await Geolocator.checkPermission();
              if (p == LocationPermission.denied) p = await Geolocator.requestPermission();
              if (p == LocationPermission.denied || p == LocationPermission.deniedForever) return;
              final pos = await Geolocator.getCurrentPosition();
              final url = 'https://www.google.com/maps/search/?api=1&query=${pos.latitude},${pos.longitude}';
              await supabase.from('messages').insert({
                'sender_phone': widget.senderContact,
                'receiver_contact': widget.receiverContact,
                'content': '${widget.senderName}: موقعي الحالي 📍',
                'msg_type': 'location',
                'media_url': url,
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(title: Text(widget.chatTitle, style: const TextStyle(color: Colors.white)), backgroundColor: const Color(0xFF075E54)),
                body: Column(
                  children: [
                    Expanded(
                      child: StreamBuilder<List<JsonMap>>(
                        stream: supabase.from('messages').stream(primaryKey: ['id']).order('created_at', ascending: true),
                        builder: (_, snap) {
                          if (!snap.hasData) return const Center(child: CircularProgressIndicator());
                          final msgs = snap.data!.where((m) {
                            if (widget.receiverContact == 'ALL') return m['receiver_contact'] == 'ALL' || m['receiver_contact'] == null;
                            return (m['sender_phone'] == widget.senderContact && m['receiver_contact'] == widget.receiverContact) || (m['sender_phone'] == widget.receiverContact && m['receiver_contact'] == widget.senderContact);
                          }).toList();
                          return ListView.builder(
                            padding: const EdgeInsets.all(10),
                            itemCount: msgs.length,
                            itemBuilder: (_, i) {
                              final m = msgs[i];
                              final isMe = m['sender_phone'] == widget.senderContact;
                              final type = m['msg_type'] ?? 'text';
                              final url = m['media_url'];
                              return Align(
                                alignment: isMe ? Alignment.centerRight : Alignment.centerLeft,
                                child: Container(
                                  margin: const EdgeInsets.symmetric(vertical: 4),
                                  padding: const EdgeInsets.all(10),
                                  decoration: BoxDecoration(color: isMe ? const Color(0xFFDCF8C6) : Colors.grey.shade200, borderRadius: BorderRadius.circular(10)),
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(m['content'] ?? ''),
                                      if (type == 'image' && url != null) Image.network(url, height: 150),
                                      if ((type == 'video' || type == 'location' || type == 'link') && url != null)
                                        TextButton(onPressed: () => launchUrl(Uri.parse(url)), child: Text(type == 'location' ? 'فتح الخريطة' : 'فتح الرابط/الفيديو')),
                                      if (type == 'audio' && url != null)
                                        TextButton(onPressed: () => _player.play(UrlSource(url)), child: const Text('تشغيل الصوت')),
                                    ],
                                  ),
                                ),
                              );
                            },
                          );
                        },
                      ),
                    ),
                    Row(
                      children: [
                        IconButton(icon: const Icon(Icons.image), onPressed: () => _sendMedia(false)),
                        IconButton(icon: const Icon(Icons.videocam), onPressed: () => _sendMedia(true)),
                        IconButton(icon: const Icon(Icons.location_on), onPressed: _sendLoc),
                        IconButton(icon: Icon(_recording ? Icons.stop : Icons.mic, color: _recording ? Colors.red : null), onPressed: _toggleAudio),
                        Expanded(child: TextField(controller: _ctrl, decoration: const InputDecoration(hintText: 'رسالة أو رابط...'))),
                        IconButton(icon: const Icon(Icons.send), onPressed: _sendText),
                      ],
                    ),
                  ],
                ),
              );
            }
          }
