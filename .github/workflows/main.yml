name: Build EG Masr APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project & Disable Lint Abort
        run: |
          flutter create --platforms=android .
          python3 -c '
          import glob
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              s = s.replace("flutter.compileSdkVersion", "36")
              s = s.replace("flutter.minSdkVersion", "24")
              s = s.replace("flutter.targetSdkVersion", "35")
              if "buildTypes" in s:
                  s = s.replace("buildTypes {", "lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }\n    buildTypes {")
              with open(path, "w") as f:
                  f.write(s)
          '
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.CAMERA"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eg-masr-super-app-v2
          path: build/app/outputs/flutter-apk/app-release.apk
