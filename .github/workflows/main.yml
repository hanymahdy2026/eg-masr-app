name: Build EG Masr Android & iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Prepare Android Project
        run: |
          flutter create --platforms=android .
          flutter pub get
          sed -i 's/id("org.jetbrains.kotlin.android") version ".*"/id("org.jetbrains.kotlin.android") version "2.1.0"/g' android/settings.gradle.kts || true
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle.kts || true
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' android/app/src/main/AndroidManifest.xml
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: eg-masr-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Prepare iOS Project & Permissions
        run: |
          flutter create --platforms=ios .
          flutter pub get
          cat << 'EOF' > ios/Podfile
          platform :ios, '14.0'
          ENV['COCOAPODS_DISABLE_STATS'] = 'true'
          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }
          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}. Try deleting Generated.xcconfig, then run flutter pub get"
          end
          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)
          flutter_ios_podfile_setup
          target 'Runner' do
            use_frameworks!
            use_modular_headers!
            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
          end
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
              end
            end
          end
          EOF
          plutil -insert NSCameraUsageDescription -string "مطلوب لتصوير الباركود والصور" ios/Runner/Info.plist || true
          plutil -insert NSMicrophoneUsageDescription -string "مطلوب لتسجيل الرسائل الصوتية" ios/Runner/Info.plist || true
          plutil -insert NSContactsUsageDescription -string "مطلوب للوصول لجهات الاتصال" ios/Runner/Info.plist || true
          plutil -insert NSPhotoLibraryUsageDescription -string "مطلوب لاختيار الصور والفيديوهات" ios/Runner/Info.plist || true
          plutil -insert NSLocationWhenInUseUsageDescription -string "مطلوب لمشاركة موقعك الحالي" ios/Runner/Info.plist || true
      - name: Build Unsigned iOS IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r eg-masr-ios.ipa Payload
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: eg-masr-iphone-ipa
          path: eg-masr-ios.ipa
