name: Build EG Masr Android & iOS
on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Prepare Android Project
        run: |
          flutter create . --platforms=android
          flutter pub get
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: eg-masr-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
      - name: Prepare iOS Project
        run: |
          flutter create . --platforms=ios
          flutter pub get
      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons
      - name: Package & Upload iOS IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r eg-masr-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: eg-masr-iphone-ipa
          path: eg-masr-ios.ipa
